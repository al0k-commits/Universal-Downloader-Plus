name: Build & Release

on:
  push:
    tags:
      - "v*"
  # Allows a dry-run build from the Actions tab without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: UniversalDownloaderPlus
  PRODUCT_NAME: "Universal Downloader+"
  DEB_PACKAGE: universal-downloader-plus
  MAINTAINER: "Alok <al0k-commits@users.noreply.github.com>"
  WIX3_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
  # Official "latest stable 6.x" redirect published by jrsoftware.
  INNO_URL: https://jrsoftware.org/download.php/is.exe

jobs:
  build:
    name: Build (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-x64
            py_arch: x64
            wix_arch: x64
            inno_arch: x64
            ffmpeg_arch: win64

          # GitHub-hosted Windows-on-ARM runner (Snapdragon / Ryzen AI class).
          # Free for public repos; label is `windows-11-arm`.
          - os: windows-11-arm
            slug: windows-arm64
            py_arch: arm64
            wix_arch: arm64
            inno_arch: arm64
            ffmpeg_arch: winarm64

          - os: macos-latest
            slug: macos-arm64
            py_arch: arm64

          - os: ubuntu-latest
            slug: linux-x64
            py_arch: x64
            deb_arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.11: pyqtdarktheme 2.1.0 declares Requires-Python
          # ">=3.7,<3.12" and has no 3.12 distribution on PyPI.
          python-version: "3.11"
          architecture: ${{ matrix.py_arch }}
          cache: pip

      # Qt WebEngine needs these X/GL libs present even to *build* cleanly,
      # and they are required for the smoke test to import QtWebEngineWidgets.
      - name: Install Linux Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libnss3 libxdamage1 libxrandr2 \
            libasound2t64 libatk-bridge2.0-0 libgbm1 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # ------------------------------------------------------------------
      # Derive the version once. Tag pushes use the tag; manual runs get a
      # dev stamp so the artifact name is never empty.
      #
      # msi_version is the same value reduced to a strict x.y.z numeric form,
      # because Windows Installer (and Inno's VersionInfoVersion) rejects
      # anything else.
      #
      # deb_version keeps the prerelease information but rewrites it into a
      # Debian-legal ordering: 1.2.0~rc1 sorts *before* 1.2.0, which is what a
      # prerelease should do.
      # ------------------------------------------------------------------
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0.0-dev.${GITHUB_SHA::7}"
          fi
          RAW="${VERSION#v}"          # drop leading v
          NUMERIC="${RAW%%-*}"        # drop any -rc1 / -dev.abc1234 suffix
          if [[ ! "$NUMERIC" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            NUMERIC="0.0.0"
          fi
          SUFFIX="${RAW#"$NUMERIC"}"  # "" or "-rc1" / "-dev.abc1234"
          if [[ -n "$SUFFIX" ]]; then
            # ~ makes the prerelease sort below the final release in dpkg.
            DEB_VERSION="${NUMERIC}~${SUFFIX#-}"
          else
            DEB_VERSION="${NUMERIC}"
          fi
          # Debian versions may not contain '_' or upper-case oddities.
          DEB_VERSION="$(echo "$DEB_VERSION" | tr '_' '.' | tr -cd '0-9A-Za-z.+~-')"

          echo "version=${VERSION}"        >> "$GITHUB_OUTPUT"
          echo "msi_version=${NUMERIC}"    >> "$GITHUB_OUTPUT"
          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "basename=${APP_NAME}-${VERSION}-${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      # ==================================================================
      # FFmpeg: fetch static ffmpeg + ffprobe into ./ffmpeg at the repo root.
      # FFMPEG_DIR resolves to <exe dir>/ffmpeg when frozen, so these get
      # staged beside the binary further down.
      # ==================================================================
      #
      # BtbN publishes both win64 and winarm64 static builds from one release,
      # so a single step covers both Windows matrix legs.
      - name: Fetch FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-${{ matrix.ffmpeg_arch }}-gpl.zip"
          curl -fsSL --retry 3 -o ffmpeg.zip "$URL"
          unzip -qo ffmpeg.zip
          mkdir -p ffmpeg
          cp ffmpeg-*/bin/ffmpeg.exe  ffmpeg/
          cp ffmpeg-*/bin/ffprobe.exe ffmpeg/
          rm -rf ffmpeg-master-latest-*/ ffmpeg.zip
          ./ffmpeg/ffmpeg.exe -version | head -n 1

      - name: Fetch FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ffmpeg-btbn.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf ffmpeg-btbn.tar.xz
          mkdir -p ffmpeg
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg  ffmpeg/
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe ffmpeg/
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          rm -rf ffmpeg-master-latest-linux64-gpl ffmpeg-btbn.tar.xz
          ./ffmpeg/ffmpeg -version | head -n 1

      # macos-latest is arm64. Most "static macOS ffmpeg" mirrors publish
      # x86_64 only, which would produce a binary the app cannot exec.
      # Homebrew gives a natively-executable build for the runner's arch.
      - name: Fetch FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install ffmpeg
          mkdir -p ffmpeg
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg"  ffmpeg/ffmpeg
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" ffmpeg/ffprobe
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          ./ffmpeg/ffmpeg -version | head -n 1

      # ==================================================================
      # PyInstaller. --add-data separator is ';' on Windows, ':' elsewhere.
      # resources/ is bundled into sys._MEIPASS (get_resource_path reads it);
      # ffmpeg is NOT bundled here -- it is staged next to the binary instead,
      # because _MEIPASS is deleted on exit and FFMPEG_DIR points at the exe
      # directory when frozen.
      # ==================================================================
      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "${APP_NAME}" \
            --icon src/universal_downloader/resources/icon.ico \
            --add-data "src/universal_downloader/resources;resources" \
            --collect-all PyQt6.QtWebEngineWidgets \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all qtawesome \
            --collect-all yt_dlp \
            src/universal_downloader/__main__.py

      # GitHub's ubuntu-latest images carry heavy SDK/toolchain installs
      # (/usr/share/dotnet, Android SDK, GHC) that eat ~20GB+ of the 14GB
      # runner disk. Removing them frees space for the .deb packaging step,
      # which otherwise dies with "tar: stdout: write error: No space left".
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "${APP_NAME}" \
            --add-data "src/universal_downloader/resources:resources" \
            --collect-all PyQt6.QtWebEngineWidgets \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all qtawesome \
            --collect-all yt_dlp \
            src/universal_downloader/__main__.py

      # macOS ignores --onefile for windowed apps and emits a .app bundle.
      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "${APP_NAME}" \
            --icon src/universal_downloader/resources/icon.icns \
            --add-data "src/universal_downloader/resources:resources" \
            --collect-all PyQt6.QtWebEngineWidgets \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all qtawesome \
            --collect-all yt_dlp \
            src/universal_downloader/__main__.py

      # ==================================================================
      # Stage FFmpeg so FFMPEG_DIR (= dirname(sys.executable)/ffmpeg) hits.
      # ==================================================================
      - name: Stage FFmpeg beside binary (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist/ffmpeg
          cp ffmpeg/* dist/ffmpeg/
          ls -la dist/ dist/ffmpeg/

      - name: Stage FFmpeg inside .app (macOS)
        if: runner.os == 'macOS'
        run: |
          # sys.executable inside a bundle is Contents/MacOS/<name>, so
          # FFMPEG_DIR resolves to Contents/MacOS/ffmpeg.
          mkdir -p "dist/${APP_NAME}.app/Contents/MacOS/ffmpeg"
          cp ffmpeg/ffmpeg ffmpeg/ffprobe \
            "dist/${APP_NAME}.app/Contents/MacOS/ffmpeg/"
          ls -la "dist/${APP_NAME}.app/Contents/MacOS/ffmpeg/"

      # ==================================================================
      # Code signing, branded "Alok".
      # NOTE: a self-signed cert is NOT trusted by SmartScreen/Gatekeeper on
      # end-user machines. It proves integrity, not identity. Users will still
      # see a warning; real trust needs a paid OV/EV cert or an Apple Dev ID.
      #
      # The thumbprint is exported so the MSI and the Inno Setup EXE produced
      # later are signed with the *same* certificate.
      # ==================================================================
      - name: Sign Windows EXE (self-signed "Alok")
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\$env:APP_NAME.exe"

          $cert = New-SelfSignedCertificate `
            -DnsName "Alok" `
            -Subject "CN=Alok, O=Universal Downloader Plus, C=IN" `
            -CertStoreLocation "cert:\CurrentUser\My" `
            -Type CodeSigningCert `
            -KeyUsage DigitalSignature `
            -KeyUsageProperty All `
            -NotAfter (Get-Date).AddYears(3)
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # On an arm64 runner the x64 SignTool still runs fine under emulation,
          # so accept either host architecture directory.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\(x64|arm64)\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1

          if ($signtool) {
            Write-Host "Using SignTool: $($signtool.FullName)"
            "signtool=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            # Timestamping keeps the signature valid past cert expiry.
            & $signtool.FullName sign `
              /sha1 $cert.Thumbprint /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 `
              $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          } else {
            Write-Host "SignTool not found - falling back to Set-AuthenticodeSignature."
            "signtool=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            $sig = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            if ($sig.Status -ne "Valid" -and $sig.Status -ne "UnknownError") {
              throw "Signing failed: $($sig.Status) - $($sig.StatusMessage)"
            }
          }

          Get-AuthenticodeSignature $exe | Format-List Status, StatusMessage, SignerCertificate

      - name: Ad-hoc sign macOS .app ("Alok")
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dist/${APP_NAME}.app"
          # Sign the FFmpeg binaries first: --deep does not reliably cover
          # executables we copied in after PyInstaller finished.
          codesign --force --sign - --timestamp=none \
            "$APP/Contents/MacOS/ffmpeg/ffmpeg" \
            "$APP/Contents/MacOS/ffmpeg/ffprobe"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"

      # ==================================================================
      # Smoke test: prove the frozen binary actually starts. Catches missing
      # Qt plugins / hidden imports that only surface after packaging.
      # ==================================================================
      - name: Smoke test frozen binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          file "dist/${APP_NAME}"
          test -x dist/ffmpeg/ffmpeg
          # Launch briefly under Xvfb; a clean timeout means it booted OK.
          timeout 25s xvfb-run -a "./dist/${APP_NAME}" || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            echo "::error::Frozen binary exited with $rc"; exit 1
          fi
          echo "Binary launched cleanly."

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f "dist/${APP_NAME}.exe"
          test -f dist/ffmpeg/ffmpeg.exe
          test -f dist/ffmpeg/ffprobe.exe
          echo "Artifacts present."

      - name: Verify build output (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d "dist/${APP_NAME}.app"
          test -x "dist/${APP_NAME}.app/Contents/MacOS/ffmpeg/ffmpeg"
          echo "Bundle present."

      - name: Create artifacts directory
        shell: bash
        run: mkdir -p artifacts

      # ==================================================================
      # WINDOWS PACKAGING
      #   1. portable  -> <basename>-portable.exe
      #   2. wizard    -> <basename>-Setup.exe   (Inno Setup 6: ISCC)
      #   3. msi       -> <basename>.msi         (WiX v3: candle + light)
      # ==================================================================
      - name: Package portable EXE (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cp "dist/${APP_NAME}.exe" "artifacts/${{ steps.ver.outputs.basename }}-portable.exe"

      # windows-latest ships Inno Setup 6 preinstalled. windows-11-arm does not,
      # so install it silently from the official stable download. ISCC is a
      # 32-bit x86 tool and runs fine on arm64 under emulation - it only
      # *targets* arm64, it does not have to be arm64 itself.
      - name: Locate or install Inno Setup
        id: inno
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Find-ISCC {
            $probes = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($p in $probes) { if (Test-Path $p) { return (Get-Item $p) } }
            return (Get-ChildItem "C:\Program Files (x86)","C:\Program Files" `
                      -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                    Sort-Object FullName -Descending | Select-Object -First 1)
          }

          $iscc = Find-ISCC
          if (-not $iscc) {
            Write-Host "Inno Setup not preinstalled - downloading stable 6.x..."
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -UseBasicParsing
            # /VERYSILENT keeps the wizard headless; /SP- kills the "this will
            # install..." prompt; /NORESTART is belt and braces on a runner.
            $p = Start-Process -FilePath $setup -Wait -PassThru `
                   -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NORESTART','/NOCANCEL'
            if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
            $iscc = Find-ISCC
          }
          if (-not $iscc) { throw "ISCC.exe not found after installation." }

          Write-Host "ISCC: $($iscc.FullName)"
          "iscc=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NUM_VERSION: ${{ steps.ver.outputs.msi_version }}
          FULL_VERSION: ${{ steps.ver.outputs.version }}
          APP_ARCH: ${{ matrix.inno_arch }}
          OUT_BASENAME: ${{ steps.ver.outputs.basename }}
        run: |
          $ErrorActionPreference = "Stop"
          & "${{ steps.inno.outputs.iscc }}" /Qp `
            "/DMyAppVersion=$env:NUM_VERSION" `
            "/DMyAppFullVersion=$env:FULL_VERSION" `
            "/DSourceDir=dist" `
            "/DAppArch=$env:APP_ARCH" `
            "/Oartifacts" `
            "/F$env:OUT_BASENAME-Setup" `
            "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-Item "artifacts\$env:OUT_BASENAME-Setup.exe" | Format-List Name, Length

      - name: Sign Inno Setup installer (Windows)
        if: runner.os == 'Windows' && steps.winsign.outputs.signtool != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "artifacts\${{ steps.ver.outputs.basename }}-Setup.exe"
          & "${{ steps.winsign.outputs.signtool }}" sign `
            /sha1 "${{ steps.winsign.outputs.thumbprint }}" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            $setup
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on Setup EXE ($LASTEXITCODE)" }
          Get-AuthenticodeSignature $setup | Format-List Status, StatusMessage

      # windows-latest ships WiX v3.14 preinstalled. windows-11-arm currently
      # does not, so fall back to the official binaries zip (x86 tooling, which
      # runs fine under emulation and can still target -arch arm64).
      - name: Locate or install WiX Toolset
        id: wix
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candle = Get-ChildItem "C:\Program Files (x86)" -Recurse -Filter candle.exe `
                      -ErrorAction SilentlyContinue |
                    Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $candle -and $env:WIX) {
            $probe = Join-Path $env:WIX "bin\candle.exe"
            if (Test-Path $probe) { $candle = Get-Item $probe }
          }

          if (-not $candle) {
            Write-Host "WiX not preinstalled - downloading wix314-binaries..."
            $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
            $dir = Join-Path $env:RUNNER_TEMP "wix314"
            Invoke-WebRequest -Uri $env:WIX3_URL -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $candle = Get-Item (Join-Path $dir "candle.exe")
          }

          $bin = Split-Path -Parent $candle.FullName
          Write-Host "WiX bin: $bin"
          "bin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          & $candle.FullName -? | Select-Object -First 2

      - name: Build MSI installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.ver.outputs.msi_version }}
          WIX_ARCH: ${{ matrix.wix_arch }}
          OUT_BASENAME: ${{ steps.ver.outputs.basename }}
        run: |
          $ErrorActionPreference = "Stop"
          $candle = Join-Path "${{ steps.wix.outputs.bin }}" "candle.exe"
          $light  = Join-Path "${{ steps.wix.outputs.bin }}" "light.exe"
          New-Item -ItemType Directory -Force -Path "obj" | Out-Null

          & $candle -nologo `
            -arch $env:WIX_ARCH `
            -dProductVersion="$env:MSI_VERSION" `
            -dSourceDir="dist" `
            -ext WixUtilExtension `
            -out "obj\installer.wixobj" `
            "installer.wxs"
          if ($LASTEXITCODE -ne 0) { throw "candle failed ($LASTEXITCODE)" }

          & $light -nologo -spdb `
            -ext WixUIExtension -ext WixUtilExtension `
            -cultures:en-us `
            -out "artifacts\$env:OUT_BASENAME.msi" `
            "obj\installer.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light failed ($LASTEXITCODE)" }

          Get-Item "artifacts\$env:OUT_BASENAME.msi" | Format-List Name, Length

      - name: Sign MSI (Windows)
        if: runner.os == 'Windows' && steps.winsign.outputs.signtool != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = "artifacts\${{ steps.ver.outputs.basename }}.msi"
          & "${{ steps.winsign.outputs.signtool }}" sign `
            /sha1 "${{ steps.winsign.outputs.thumbprint }}" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            $msi
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on MSI ($LASTEXITCODE)" }
          Get-AuthenticodeSignature $msi | Format-List Status, StatusMessage

      # ==================================================================
      # macOS PACKAGING -> <basename>.dmg
      # A staging folder plus an /Applications symlink gives the familiar
      # "drag the icon into the folder" installer window.
      # ==================================================================
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.basename }}"
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"

          # ditto (not cp) preserves symlinks, resource forks and the signature.
          ditto "dist/${APP_NAME}.app" "$STAGE/${APP_NAME}.app"
          ln -s /Applications "$STAGE/Applications"

          # A .DS_Store-free image still opens in icon view; keeping the
          # window small and the volume named after the product is what makes
          # it look like a normal Mac installer.
          hdiutil create \
            -volname "${PRODUCT_NAME}" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            "artifacts/${NAME}.dmg"

          hdiutil verify "artifacts/${NAME}.dmg"
          # Ad-hoc sign the image itself so the signature survives download.
          codesign --force --sign - "artifacts/${NAME}.dmg"
          ls -lh "artifacts/${NAME}.dmg"

      # ==================================================================
      # LINUX PACKAGING -> <basename>.deb
      #
      # Layout:
      #   /opt/UniversalDownloaderPlus/UniversalDownloaderPlus   (binary)
      #   /opt/UniversalDownloaderPlus/ffmpeg/{ffmpeg,ffprobe}   (FFMPEG_DIR)
      #   /usr/bin/universal-downloader-plus                     (symlink)
      #   /usr/share/applications/*.desktop                      (menu entry)
      #   /usr/share/icons/hicolor/<size>/apps/*.png             (icons)
      #
      # /opt is required because FFMPEG_DIR is dirname(sys.executable)/ffmpeg -
      # dropping the binary straight into /usr/bin would make it look for
      # /usr/bin/ffmpeg/ffmpeg.
      # ==================================================================
      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        env:
          DEB_VERSION: ${{ steps.ver.outputs.deb_version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          OUT_BASENAME: ${{ steps.ver.outputs.basename }}
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)/pkg"
          OPTDIR="$ROOT/opt/${APP_NAME}"

          mkdir -p "$ROOT/DEBIAN" \
                   "$OPTDIR/ffmpeg" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/doc/${DEB_PACKAGE}"

          install -m 0755 "dist/${APP_NAME}"     "$OPTDIR/${APP_NAME}"
          install -m 0755 dist/ffmpeg/ffmpeg     "$OPTDIR/ffmpeg/ffmpeg"
          install -m 0755 dist/ffmpeg/ffprobe    "$OPTDIR/ffmpeg/ffprobe"
          ln -s "/opt/${APP_NAME}/${APP_NAME}" "$ROOT/usr/bin/${DEB_PACKAGE}"

          for SIZE in 16 24 32 48 64 96 128 256 512; do
            SRC="src/universal_downloader/resources/icon-${SIZE}x${SIZE}.png"
            [ -f "$SRC" ] || continue
            DEST="$ROOT/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps"
            mkdir -p "$DEST"
            install -m 0644 "$SRC" "$DEST/${DEB_PACKAGE}.png"
          done

          cat > "$ROOT/usr/share/applications/${DEB_PACKAGE}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${PRODUCT_NAME}
          GenericName=Video Downloader
          Comment=Download video and audio from the web
          Exec=/opt/${APP_NAME}/${APP_NAME} %U
          Icon=${DEB_PACKAGE}
          Terminal=false
          Categories=AudioVideo;Network;Utility;
          Keywords=youtube;download;video;audio;yt-dlp;
          StartupWMClass=${APP_NAME}
          EOF
          chmod 0644 "$ROOT/usr/share/applications/${DEB_PACKAGE}.desktop"

          install -m 0644 LICENSE "$ROOT/usr/share/doc/${DEB_PACKAGE}/copyright"

          INSTALLED_KB="$(du -sk "$ROOT" | cut -f1)"

          # Runtime deps are the Qt/WebEngine libs the frozen bundle dlopen()s
          # but does not ship. The `a | b` alternatives cover the Ubuntu 24.04
          # t64 ABI rename while staying installable on older releases.
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: ${DEB_PACKAGE}
          Version: ${DEB_VERSION}
          Section: video
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: ${MAINTAINER}
          Installed-Size: ${INSTALLED_KB}
          Depends: libc6, libglib2.0-0 | libglib2.0-0t64, libgl1, libegl1, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libnss3, libxdamage1, libxrandr2, libasound2t64 | libasound2, libatk-bridge2.0-0 | libatk-bridge2.0-0t64, libgbm1, libdbus-1-3, fontconfig
          Homepage: https://github.com/al0k-commits/Universal-Downloader-Plus
          Description: ${PRODUCT_NAME} - desktop video and audio downloader
           PyQt6 + yt-dlp desktop downloader with an embedded Chromium browser,
           persistent logins, playlist queueing and pause/resume/cancel support.
           .
           Static ffmpeg and ffprobe binaries are bundled, so no separate FFmpeg
           installation is required.
          EOF

          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "configure" ]; then
            if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
            fi
            if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -f -t /usr/share/icons/hicolor || true
            fi
          fi
          exit 0
          EOF

          cat > "$ROOT/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
            fi
            if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -f -t /usr/share/icons/hicolor || true
            fi
          fi
          exit 0
          EOF

          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/postrm"

          # Fix ownership: dpkg-deb expects root-owned files, but the runner
          # created them as a non-root user. Without this, tar inside dpkg-deb
          # can hit write errors on the large payload.
          sudo chown -R root:root "$ROOT"

          # --root-owner-group avoids shipping the runner's uid/gid in the deb.
          # -Zgzip keeps the compression pipeline light for large bundles.
          dpkg-deb --build --root-owner-group -Zgzip "$ROOT" \
            "artifacts/${OUT_BASENAME}.deb"

          echo "--- control ---"
          dpkg-deb --info "artifacts/${OUT_BASENAME}.deb"
          echo "--- contents ---"
          dpkg-deb --contents "artifacts/${OUT_BASENAME}.deb" | head -n 20
          ls -lh "artifacts/${OUT_BASENAME}.deb"

      - name: Verify .deb installs cleanly (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          DEB="artifacts/${{ steps.ver.outputs.basename }}.deb"
          sudo apt-get install -y "./$DEB"
          test -x "/opt/${APP_NAME}/${APP_NAME}"
          test -x "/opt/${APP_NAME}/ffmpeg/ffmpeg"
          test -L "/usr/bin/${DEB_PACKAGE}"
          "/opt/${APP_NAME}/ffmpeg/ffmpeg" -version | head -n 1
          sudo apt-get remove -y "${DEB_PACKAGE}"
          echo "Package install/remove cycle OK."

      # ==================================================================
      # Checksums + upload
      # ==================================================================
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.basename }}
          path: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Universal Downloader+ ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          body: |
            ## Universal Downloader+ ${{ github.ref_name }}

            Native installers for Windows, macOS and Linux — FFmpeg is bundled,
            no separate install required.

            | Platform | Recommended installer | Alternative |
            |---|---|---|
            | Windows x64 (Intel/AMD)     | `UniversalDownloaderPlus-${{ github.ref_name }}-windows-x64-Setup.exe`   | `...-windows-x64.msi` · `...-windows-x64-portable.exe`   |
            | Windows arm64 (Snapdragon)  | `UniversalDownloaderPlus-${{ github.ref_name }}-windows-arm64-Setup.exe` | `...-windows-arm64.msi` · `...-windows-arm64-portable.exe` |
            | macOS arm64 (Apple Silicon) | `UniversalDownloaderPlus-${{ github.ref_name }}-macos-arm64.dmg`         | — |
            | Linux x64 (Debian/Ubuntu)   | `UniversalDownloaderPlus-${{ github.ref_name }}-linux-x64.deb`           | — |

            Every asset ships a matching `.sha256` file.

            **Windows:** `-Setup.exe` is the classic install wizard (Inno Setup)
            — pick this one. The `.msi` is the same install for Group Policy /
            `msiexec /i ... /qn` deployments. The `-portable.exe` needs no
            install, but you must keep an `ffmpeg/` folder beside it.

            **macOS:** open the `.dmg` and drag the app into Applications.

            **Linux:** `sudo apt install ./UniversalDownloaderPlus-*-linux-x64.deb`
            then launch from your app menu or run `universal-downloader-plus`.

            > **Security notice:** these binaries are self-signed / ad-hoc signed.
            > Windows SmartScreen and macOS Gatekeeper will still warn on first run.
            > On macOS: `xattr -dr com.apple.quarantine /Applications/UniversalDownloaderPlus.app`
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.sha256
